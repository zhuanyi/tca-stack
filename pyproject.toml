[project]
name = "tca"
version = "0.1.0"
description = "Transaction cost analysis and execution research for US Treasuries and spot FX."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "statsmodels>=0.14",
    "typer>=0.12",
]

[project.optional-dependencies]
agent = [
    "anthropic>=0.40",
    "mcp>=1.2",
    "sqlglot>=25",
]

[project.scripts]
tca = "tca.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tca"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["specs", "notes"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
